# Curated month-precision metadata for the timeline (scripts/build_timeline.py).
#
# papers.bib carries only a year, but a timeline needs months. Every date in this
# file is written down together with the evidence for it, because a date nobody can
# justify is worse than no date at all: entries left out here fall back to the
# arXiv identifier's YYMM when there is one, and otherwise to the year's midpoint
# with "approx": true, which the component is expected to render differently.
#
# Rules for adding a line:
#   - `date` must be YYYY-MM and must be defensible from `note`. Conference months
#     come from the venue; thesis months come from resume.json defence dates;
#     journal months come from the publisher's own record (checked against Crossref
#     and recorded in the note, so this file stays offline and deterministic).
#   - `theme` is required and must be one of: cultural-heritage, multimodal,
#     symbolic-music, dsp-tooling, musicology, engineering.
#   - Omit `date` (keep `theme`) when the month is genuinely unknown.

papers:
  10.1007/978-3-031-51026-7_26:
    date: '2023-09'
    theme: cultural-heritage
    note: >-
      Presented at ICIAP 2023 workshops, Udine, 11-15 September 2023; the Springer
      proceedings volume carries a 2024 imprint (online 2024-01-21), but the work
      belongs to the conference month.

  https://doi.org/10.13140/rg.2.2.36838.50247:
    date: '2023-03'
    theme: cultural-heritage
    note: >-
      BSc thesis, Ca' Foscari University of Venice; resume.json records the degree
      completed 2023-03-27.

  https://doi.org/10.13140/rg.2.2.17327.82088:
    date: '2021-11'
    theme: musicology
    note: >-
      MA thesis in clarinet, Conservatorio Cesare Pollini; resume.json records the
      degree completed 2021-11-26.

  https://doi.org/10.13140/rg.2.2.24143.56489:
    date: '2019-11'
    theme: musicology
    note: >-
      BA thesis in clarinet, Conservatorio Cesare Pollini; resume.json records the
      degree completed 2019-11-22.

  sphor:woo15:
    theme: musicology
    note: >-
      Edizioni Eufonia edition, 2019. The publisher's catalogue gives no month, so
      this one stays approximate on purpose.

  bosi2024a:
    date: '2024-10'
    theme: cultural-heritage
    note: >-
      AES Show 2024, New York, 8-10 October 2024; resume.json gives the release
      date as 2024-10-09.

  ieeeaccess2024:
    theme: cultural-heritage
    note: >-
      IEEE Access vol. 12, doi 10.1109/ACCESS.2024.3474529. Crossref records only
      the year (2024) and OpenAlex reports a placeholder 2024-01-01, so no month is
      defensible; left approximate.

  Cinar2024:
    date: '2024-11'
    theme: cultural-heritage
    note: >-
      IAI4CH 2024 workshop, co-located with AIxIA 2024 in Bozen, 25-28 November
      2024; the Zenodo deposit (10.5281/zenodo.14028923) is dated 2024-11-28.

  Spanio2024:
    date: '2024-11'
    theme: multimodal
    note: >-
      AIxIA 2024 Doctoral Consortium, Bozen, 25-28 November 2024.

  spanio_frontiers_2025:
    date: '2025-07'
    theme: multimodal
    note: >-
      Frontiers in Computer Science, published online 7 July 2025 (Crossref record
      for 10.3389/fcomp.2025.1575741).

  fiordelmondo_nime_2025:
    date: '2025-06'
    theme: engineering
    note: >-
      NIME 2025, Canberra, June 2025; the Zenodo proceedings deposit
      (10.5281/zenodo.15698958) is dated 2025-06-19.

  spanio2025torchfx:
    date: '2025-09'
    theme: dsp-tooling
    note: >-
      DAFx-25, Ancona, 2-6 September 2025. The arXiv preprint (2504.08624) predates
      the conference by five months; the timeline follows the presentation.

  spanio2026bmdataset:
    theme: symbolic-music
    note: >-
      No venue month yet; the month is taken from the arXiv identifier 2604.10628.

  spanio2026multimodal:
    theme: multimodal
    note: >-
      No venue month yet; the month is taken from the arXiv identifier 2604.10632.

  canazza2026preserving:
    date: '2026-06'
    theme: cultural-heritage
    note: >-
      Ital-IA 2026, Rome, 18 June 2026 (announced in src/content/news/2026-ItalIA.md).

  spanio2026lilypond:
    date: '2026-06'
    theme: symbolic-music
    note: >-
      Ital-IA 2026, Rome, 18 June 2026; the arXiv identifier 2606.08722 agrees.

  pretto2026advanced:
    theme: cultural-heritage
    note: >-
      AVI-CH 2026 workshop, accepted for publication. No workshop date is confirmed
      in any source held here, so this one stays approximate.

