name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deploy mid-flight; a half-published site is worse than a slow one.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: withastro/action@v6
        with:
          node-version: 22

      # The build artifact is already uploaded by the action above; assert the
      # legacy URL contract against it before anything gets published.
      - name: Check legacy URLs still resolve
        run: node scripts/check_legacy_urls.mjs dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
