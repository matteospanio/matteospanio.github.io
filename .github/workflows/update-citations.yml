name: Update citations

on:
  schedule:
    - cron: "0 4 * * 1,3,5" # Mon/Wed/Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # PAT rather than GITHUB_TOKEN: the built-in token deliberately does not
      # trigger downstream workflows, and this push needs to trigger Deploy.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r scripts/requirements-data.txt

      # Scholar throttles datacenter IPs, so a failed run must leave the existing
      # numbers alone rather than fail the job. The script already merges by max.
      - name: Refresh citation counts
        continue-on-error: true
        run: timeout 300 python scripts/update_citations.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/citations.json
          if git diff --staged --quiet; then
            echo "citations unchanged" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "🤖 Update citation counts"
            git push
            echo "citations updated" >> "$GITHUB_STEP_SUMMARY"
          fi
