name: Update embedding map

# Dispatch only: this downloads a ~1 GB model and is not worth running on every
# push. CI fails the build if the map goes stale, which is the reminder to run it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-embeddings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('scripts/requirements-embed.txt') }}

      - run: pip install -r scripts/requirements-embed.txt

      - run: python scripts/build_embedding_map.py

      # The projection scrubber's variants share the map's sourceHash; CI fails
      # if one is rebuilt without the other.
      - run: python scripts/build_map_variants.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/viz/embedding-map.json src/data/viz/map-variants.json
          if git diff --staged --quiet; then
            echo "embedding map unchanged" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "🤖 Rebuild the research embedding map"
            git push
          fi
