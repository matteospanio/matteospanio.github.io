name: Update footprint

on:
  schedule:
    - cron: "0 5 * * 0" # Sundays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-footprint
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # PAT so the resulting push triggers Deploy; GITHUB_TOKEN deliberately does not.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r scripts/requirements-data.txt

      - name: Rebuild footprint and timeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_footprint.py
          python scripts/build_timeline.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/viz/footprint.json src/data/viz/timeline.json
          if git diff --staged --quiet; then
            echo "footprint unchanged" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "🤖 Refresh footprint and timeline data"
            git push
            echo "footprint updated" >> "$GITHUB_STEP_SUMMARY"
          fi
